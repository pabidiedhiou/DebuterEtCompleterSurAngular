<mat-card class="post-card">
    <img mat-card-image [src] = "facesnap.imageUrl" [alt]="facesnap.title" >
    <mat-card-header>
      <mat-card-title> {{facesnap.title}} </mat-card-title>
      <mat-card-subtitle>{{facesnap.location}} </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{facesnap.description}}</p>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-icon-button color="primary">
        <mat-icon> {{facesnap.snaps}}</mat-icon>Voir
      </button>
    </mat-card-actions>
  </mat-card>
